name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./project/main
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Pack
        id: pack_step
        shell: pwsh
        run: |
          dotnet pack --configuration Release -o out
          $package = Get-ChildItem -Path "out/*.nupkg" | Select-Object -ExpandProperty FullName -First 1
          echo "PACKAGE_PATH=$package" >> $env:GITHUB_ENV
          Write-Host "Found package: $package"

      - name: Push to NuGet
        shell: pwsh
        run: |
          dotnet nuget push "${{ env.PACKAGE_PATH }}" `
            --api-key ${{ secrets.NUGET_TEST_AUTH_TOKEN }} `
            --source https://api.int.nugettest.org/v3/index.json `
            --skip-duplicate